<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0B0E" />
      <stop offset="100%" stop-color="#020203" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A2A" />
      <stop offset="50%" stop-color="#DFA55B" />
      <stop offset="100%" stop-color="#FFF1D2" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6A2A" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#DFA55B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#DFA55B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base rounded rectangle -->
  <rect width="120" height="120" rx="30" fill="url(#bg)" />
  <!-- Subtle inner border for premium glass/depth effect -->
  <rect width="118" height="118" x="1" y="1" rx="29" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  
  <!-- Core glowing aura -->
  <circle cx="60" cy="60" r="45" fill="url(#glow)" />
  
  <!-- Sharp geometric 'N' standing for Nullix -->
  <path d="M38 82 L38 38 L44 38 L82 76 L82 38 L88 38 L88 82 L82 82 L44 44 L44 82 Z" fill="url(#accent)" />
</svg>
